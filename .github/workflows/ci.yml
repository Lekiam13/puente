name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests
        run: uv run pytest -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t puente:ci .
      - name: Smoke test
        run: |
          docker run -d --name puente -p 8070:8070 \
            -e PUENTE_PEERS="a:$(openssl rand -hex 24),b:$(openssl rand -hex 24)" puente:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8070/healthz && exit 0
            sleep 1
          done
          docker logs puente
          exit 1
